name: Backend CI

on:
  push:
    paths:
      - "resyntra-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "resyntra-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resyntra-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run pytest
